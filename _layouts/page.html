{%- assign c = site.data.content -%}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page.title }} | Grave and Seed</title>
<meta name="description" content="{{ page.description }}">
{% include head.html %}
</head>
<body>
<header class="soil slim">
  <div class="wrap">
    {% include nav.html here=page.here %}
    <h1>{{ page.heading }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </div>
</header>
<main>
  <div class="wrap">
{{ content }}
  </div>
</main>
<footer>
  <div class="wrap">
    <span class="label"><a href="/" style="color: inherit">Grave and Seed LLC</a></span>
    <span class="label">{{ c.location }}</span>
  </div>
</footer>
</body>
</html>
