<style>
/* Layout: one plain column on warm paper; a collage of wind and seed at the top; oat cream, earth brown, sage and marigold (see the brand guide). */
:root {
  color-scheme: light;
  --paper: #F3EBDD;
  --ink: #3B2A20;
  --muted: #6E5F52;
  --soil: #3B2A20;
  --soil-ink: #F3EBDD;
  --moss: #56653F;
  --wheat: #8A5F10;
  --wheat-soft: #E8C277;
  --card: #FBF6EC;
  --backing: #2A1F17;
  --mat: #D9A441;
  --marigold: #D9A441;
  --marigold-deep: #C48E2C;
  --sage: #9AA88A;
  --edge-backing: url("/assets/edges/backing.png");
  --edge-paper: url("/assets/edges/paper.png");
  --wall-img: url("/assets/collage-garden.jpg");
  --line: #E2D6C2;
  --field: #F8F2E6;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --label: "Work Sans", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1F1813; --ink: #EFE6D6; --muted: #B3A592; --soil: #17110D; --soil-ink: #F3EBDD;
    --moss: #B5C4A3; --wheat: #E3B45A; --line: #3A2E25; --field: #271E18; --card: #2A221C; --backing: #0E0A07; --marigold: #E3B45A; --marigold-deep: #D9A441; --edge-backing: url("/assets/edges/backing-dark.png"); --edge-paper: url("/assets/edges/paper-dark.png"); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1F1813; --ink: #EFE6D6; --muted: #B3A592; --soil: #17110D; --soil-ink: #F3EBDD;
  --moss: #B5C4A3; --wheat: #E3B45A; --line: #3A2E25; --field: #271E18; --card: #2A221C; --backing: #0E0A07; --marigold: #E3B45A; --marigold-deep: #D9A441; --edge-backing: url("/assets/edges/backing-dark.png"); --edge-paper: url("/assets/edges/paper-dark.png"); color-scheme: dark;
}
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1.08rem/1.6 var(--body); }
.wrap { max-width: 44rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--moss); }
.label { font: 600 0.72rem/1 var(--label); letter-spacing: 0.14em; text-transform: uppercase; color: var(--wheat); }

header.soil { background: var(--soil); color: var(--soil-ink); position: relative; isolation: isolate; }
header.soil::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(46,33,25,0.55) 0%, rgba(46,33,25,0.72) 100%); }
header.soil { min-height: 30rem; display: flex; }
header.soil .wrap, header.soil.slim .wrap { width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 1.25rem; padding-block: 1.5rem 2.75rem; }
header.soil h1 { margin-top: auto; padding-top: 1.5rem; }
header.soil.slim { min-height: 21rem; }
header.soil.slim .wrap { padding-block: 1.5rem 2rem; }
header.soil .hero-cta { align-self: flex-start; }
header.soil.hero { background: var(--soil); min-height: 0; display: block; }
header.soil.hero::before { display: none; }
.hero .art { position: relative; background: #3B2A20 url("/assets/collage-garden.jpg") center 60% / cover no-repeat; aspect-ratio: 12 / 7; max-height: 70vh; width: 100%; }
.hero .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(46,33,25,0.55) 0%, rgba(46,33,25,0) 22%, rgba(59,42,32,0) 78%, var(--soil) 100%); }
.hero .art .wrap { position: relative; z-index: 1; padding-block: 1.5rem 0; }
header.soil.hero .hero-copy { padding-block: 0.75rem 3rem; }
header.soil.hero .hero-copy h1 { margin-top: 0; padding-top: 0; }
@media (max-width: 700px) { .hero .art { aspect-ratio: 4 / 3; background-image: url("/assets/collage-garden-1000.jpg"); background-position: 12% 60%; } }
@media (max-width: 700px) { header.soil { min-height: 32rem; } header.soil.slim { min-height: 23rem; } }
.mark { display: flex; align-items: center; gap: 0.6rem; font: 500 0.78rem/1 var(--label); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.8; }
.mark svg { width: 22px; height: 22px; }
header h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 600; letter-spacing: -0.01em; }
header .lede { font-size: 1.25rem; max-width: 34rem; }
header .lede em { font-style: italic; color: var(--wheat-soft); }

main .wrap { display: grid; gap: 3.5rem; padding-block: 3rem 4rem; }
section { display: grid; gap: 1rem; }
section h2 { font-size: 1.9rem; font-weight: 600; }
.plain { display: grid; gap: 0.9rem; max-width: 36rem; }

.styles { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.style { padding-block: 1.1rem; border-bottom: 1px solid var(--line); display: grid; gap: 0.35rem; min-width: 0; }
.styles .style:nth-child(odd) { padding-right: 1.25rem; }
.style h3 { font-size: 1.3rem; font-weight: 500; }
.style p { color: var(--muted); font-size: 1rem; }

.kit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.75rem; align-items: start; }
.kit figure { margin: 0; }
.kit img { width: 100%; height: auto; display: block; border-radius: 4px; }
.kit figcaption { margin-top: 0.5rem; font-size: 0.9rem; color: var(--muted); }
.kit ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.3rem; }
@media (max-width: 700px) { .kit { grid-template-columns: 1fr; gap: 1.2rem; } }
.dict { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1.75rem 1.5rem; margin-top: 0.5rem; }
.dict-item { display: grid; gap: 0.6rem; align-content: start; min-width: 0; }
.dict-item figure { margin: 0; }
.dict-item img, .dict-blank { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; border-radius: 4px; }
.dict-item img.contain { object-fit: contain; background: #fff; }
.dict-blank { display: grid; place-items: center; background: var(--field); border: 1px dashed var(--line); box-sizing: border-box; }
.dict-blank span { font: 600 0.72rem/1 var(--label); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.dict-item figcaption { margin-top: 0.35rem; font-size: 0.8rem; color: var(--muted); }
.dict-item h3 { font-size: 1.2rem; font-weight: 500; }
.dict-item .aka { font-size: 0.9rem; color: var(--muted); font-style: italic; }
.dict-item p { margin: 0; }
.behind summary { cursor: pointer; color: var(--muted); max-width: 38rem; }
.behind summary::marker { color: var(--moss); }
.behind[open] .dict { margin-top: 1.25rem; }
.tiers { display: grid; gap: 0; border-top: 1px solid var(--line); }
.tier { display: grid; grid-template-columns: 11rem 1fr; gap: 1rem; padding-block: 1rem; border-bottom: 1px solid var(--line); }
.tier h3 { font-size: 1.1rem; font-weight: 500; }
.tier .lead { display: block; margin-top: 0.35rem; }
@media (max-width: 560px) { .tier { grid-template-columns: 1fr; gap: 0.3rem; } .styles .style:nth-child(odd) { padding-right: 0; } }

.contact { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 1.5rem; display: grid; gap: 1.25rem; }
.email { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
.email code { font: 500 1rem/1.4 var(--label); user-select: all; }
.phone { font: 500 1rem/1.4 var(--label); }
.err { color: #A33A2A; font-weight: 600; }
button { font: 600 0.95rem/1 var(--body); border-radius: 4px; cursor: pointer; }
.copy { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 0.5rem 0.8rem; }
form { display: grid; gap: 0.9rem; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
label { display: grid; gap: 0.35rem; font-size: 0.95rem; min-width: 0; }
input, textarea { font: 400 1rem/1.4 var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 0.6rem 0.7rem; width: 100%; box-sizing: border-box; }
textarea { min-height: 7rem; resize: vertical; }
input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }
a:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: 2px; }
main:focus { outline: none; }
.skip { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip:focus-visible { width: auto; height: auto; overflow: visible; clip: auto; left: 0.75rem; top: 0.75rem; z-index: 100; background: var(--marigold); color: #3B2A20; padding: 0.6rem 0.9rem; border-radius: 4px; font-weight: 600; text-decoration: none; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.send { justify-self: start; background: var(--marigold); color: #3B2A20; border: 0; padding: 0.8rem 1.2rem; }
.note { color: var(--muted); font-size: 0.95rem; }
.sent { color: var(--moss); font-weight: 600; }

footer .foot-card { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem; }
footer .foot-col { display: flex; flex-direction: column; gap: 0.5rem; }
footer .foot-links { align-items: flex-end; text-align: right; }
@media (max-width: 560px) { footer .foot-links { align-items: flex-start; text-align: left; } }

.topnav { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.5rem 1.5rem; }
.topnav .brand { font: 600 1.15rem/1.2 var(--display); color: var(--soil-ink); text-decoration: none; }
.topnav .links { display: flex; flex-wrap: wrap; gap: 0.4rem 1.25rem; }
.topnav .links a { font: 500 0.8rem/1.6 var(--label); letter-spacing: 0.12em; text-transform: uppercase; color: var(--soil-ink); opacity: 0.8; text-decoration: none; }
.topnav .links a:hover, .topnav .links a[aria-current] { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
.hero-cta { display: inline-block; justify-self: start; margin-top: 0.25rem; padding: 0.7rem 1rem; border: 1px solid rgba(243,235,221,0.5); border-radius: 4px; color: var(--soil-ink); text-decoration: none; font-weight: 600; }
.hero-cta:hover { background: rgba(243,235,221,0.08); }

.budget { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 1.25rem 1.5rem; display: grid; gap: 0.75rem; }
.budget h3 { font-size: 1.3rem; font-weight: 500; }
.prose blockquote { margin: 1rem 0; padding: 0.25rem 0 0.25rem 1.1rem; border-left: 3px solid var(--wheat); font-style: italic; }
.prose blockquote strong { font-style: normal; }
.budget.plain { background: none; border: 0; padding: 0; }
.small { font-size: 0.92rem; color: var(--muted); }
.muted { color: var(--muted); }
dl.items { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem 1rem; margin: 0; }
dl.items dd { margin: 0; font-family: var(--label); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
dl.items .total { border-top: 1px solid var(--line); padding-top: 0.5rem; font-weight: 600; }
.tier .from { font-family: var(--label); font-variant-numeric: tabular-nums; font-size: 1rem; color: var(--moss); display: block; margin-top: 0.35rem; }

header.soil.slim h1 { font-size: clamp(2rem, 6vw, 2.8rem); }
header.soil.slim .lede { font-size: 1.15rem; }
.cards { display: grid; gap: 0; border-top: 1px solid var(--line); }
.card { display: grid; gap: 0.45rem; padding-block: 1.1rem; border-bottom: 1px solid var(--line); min-width: 0; }
.card h3 { font-size: 1.25rem; font-weight: 500; }
.card .meta { color: var(--muted); font-size: 0.95rem; }
.facts { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 0.3rem 1rem; margin: 0; font-size: 1rem; }
.facts dt { color: var(--muted); font: 500 0.72rem/1.9 var(--label); letter-spacing: 0.1em; text-transform: uppercase; }
.facts dd { margin: 0; }
@media (max-width: 560px) { .facts { grid-template-columns: 1fr; gap: 0.1rem; } .facts dd { margin-bottom: 0.4rem; } }
.tag { display: inline-block; font: 500 0.7rem/1 var(--label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--moss); border: 1px solid var(--moss); border-radius: 3px; padding: 0.25rem 0.4rem; margin-left: 0.4rem; vertical-align: middle; }
.box { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 1.25rem 1.5rem; display: grid; gap: 0.75rem; }
.prose { display: grid; gap: 0.9rem; max-width: 38rem; }
.prose h2 { margin-top: 0.5rem; }
.prose ul, .prose ol { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.5rem; }
.guides { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
.guide { display: grid; gap: 0.4rem; padding: 1.1rem 1.25rem; border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: var(--ink); background: var(--field); }
.guide:hover { border-color: var(--moss); }
.guide h3 { font-size: 1.2rem; font-weight: 500; color: var(--moss); }
ul.plain-list { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.5rem; max-width: 38rem; }
.addons-h { font-size: 1.3rem; font-weight: 500; margin-top: 0.75rem; }
.crisis { font-size: 0.98rem; opacity: 0.85; }
.crisis a { color: var(--wheat-soft); }
ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; border-top: 1px solid var(--line); }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 2.5rem 1fr; gap: 0 0.75rem; padding-block: 1rem; border-bottom: 1px solid var(--line); }
ol.steps li::before { content: counter(s); grid-row: span 2; font: 500 1rem/1.4 var(--label); color: var(--moss); }
ol.steps h3 { font-size: 1.1rem; font-weight: 500; }
ol.steps p { color: var(--muted); font-size: 1rem; }
.faq { border-top: 1px solid var(--line); }
.faq details { border-bottom: 1px solid var(--line); padding-block: 0.9rem; }
.faq summary { cursor: pointer; font: 500 1.1rem/1.3 var(--display); }
.faq summary::marker { color: var(--moss); }
.faq details p { margin-top: 0.6rem; max-width: 38rem; }
.book { font-weight: 600; flex-basis: 100%; }
.nav-cta { border: 1px solid rgba(243,235,221,0.6); border-radius: 4px; padding: 0 0.6rem; opacity: 1 !important; }
.next { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 1.5rem; }
.actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.button { display: inline-block; background: var(--marigold); color: #3B2A20; text-decoration: none; font-weight: 600; padding: 0.8rem 1.2rem; border-radius: 4px; }
.button.quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.tier .from { color: var(--wheat); }
.button:hover, .send:hover { background: var(--marigold-deep); }
.style h3 a { text-decoration-color: var(--wheat-soft); text-underline-offset: 4px; }

/* Collage cards, after katekeepsgrowing.com: the painted collage is the wall; each card is cream paper on a thin gold mat on blue construction paper. */
body { overflow-x: clip; background: var(--soil); }
body::before { content: ""; position: fixed; inset: 0; z-index: -3; height: 100lvh; background: var(--soil) var(--wall-img) 20% center / cover no-repeat; pointer-events: none; }
@media (max-width: 700px) { :root { --wall-img: url("/assets/collage-garden-1000.jpg"); } body::before { background-position: 12% center; } }
header.soil, header.soil.slim, header.soil.hero { background: none; min-height: 0; display: block; color: var(--ink); }
header.soil::before { display: none; }
header.soil .wrap, header.soil.slim .wrap, main .wrap > *, footer .wrap > * { position: relative; isolation: isolate; box-sizing: border-box; }
header.soil .wrap, header.soil.slim .wrap { margin-top: clamp(2rem, 9vh, 5.5rem); padding: clamp(1.4rem, 4vw, 2.25rem); gap: 1rem; max-width: 44rem; }
header.soil .wrap::before, main .wrap > *::before, footer .wrap > *::before { content: ""; position: absolute; z-index: -2; inset: -12px -18px -16px -11px; background-color: var(--backing); border-image: var(--edge-backing) 57 / 19px / 16px round; transform: rotate(var(--tilt, -0.25deg)); }
header.soil .wrap::after, main .wrap > *::after, footer .wrap > *::after { content: ""; position: absolute; z-index: -1; inset: 0; background-color: var(--card); border-image: var(--edge-paper) 21 / 7px / 6px round; }
main .wrap > *:nth-child(2n) { --tilt: 0.3deg; }
main .wrap > *:nth-child(2n)::before { inset: -16px -11px -12px -19px; }
main .wrap { gap: 3.25rem; padding-block: 3.25rem 3.5rem; max-width: 44rem; }
main .wrap > * { padding: clamp(1.4rem, 4vw, 2.25rem); margin: 0; }
main .wrap > p.note { padding-block: 1rem; }
@media (max-width: 560px) { header.soil .wrap, header.soil.slim .wrap, main .wrap, footer .wrap { margin-inline: 18px; width: auto; } header.soil .wrap::before, main .wrap > *::before, footer .wrap > *::before { inset: -9px -12px -12px -8px; } }
@media (min-width: 1000px) {
  header.soil .wrap, header.soil.slim .wrap { max-width: 40rem; margin-inline: auto; }
  main .wrap { max-width: 62rem; gap: 4.5rem; }
  main .wrap > * { width: min(40rem, 100%); }
  main .wrap > * { justify-self: center; }
  footer .wrap { max-width: 62rem; }
  footer .wrap > * { max-width: 40rem; margin-inline: auto; }
}
header.soil h1, header.soil.slim h1 { margin-top: 0.75rem; padding-top: 0; font-size: clamp(2.1rem, 6vw, 3rem); color: var(--ink); text-shadow: none; }
header .lede, header.soil.slim .lede { font-size: 1.15rem; color: var(--muted); }
header .lede em { color: var(--wheat); }
.topnav .brand, .topnav .links a { color: var(--ink); }
.topnav .links a { opacity: 0.75; }
.nav-cta { border-color: var(--ink) !important; }
.hero-cta { color: var(--ink); border-color: var(--line); }
.hero-cta:hover { background: var(--field); }
.crisis { opacity: 1; color: var(--muted); }
.crisis a { color: var(--moss); }
header.soil.hero .lede, header.soil.hero .crisis, header.soil.hero h1 { text-shadow: none; }
.next { background: none; border: 0; border-radius: 0; }
footer .wrap { margin-bottom: 3.5rem; }
footer .wrap > * { padding: 1rem clamp(1.4rem, 4vw, 2.25rem); }
footer .label a, footer .label { color: var(--muted); }
.handout-list { display: grid; gap: 1.1rem; }
.handout-card { display: grid; grid-template-columns: 9rem 1fr; gap: 1.1rem; align-items: start; padding: 1rem; border: 1px solid var(--line); border-radius: 6px; background: var(--field); color: var(--ink); text-decoration: none; }
.handout-card img { width: 100%; height: auto; background: #fff; border: 1px solid var(--line); box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
.handout-card h3 { font-size: 1.25rem; font-weight: 500; color: var(--moss); margin-bottom: 0.35rem; }
.handout-card p { margin: 0 0 0.45rem; }
.handout-card .for { font-size: 0.95rem; color: var(--muted); }
.handout-card .go { font: 600 0.82rem/1 var(--label); letter-spacing: 0.06em; text-transform: uppercase; color: var(--moss); }
.handout-card:hover h3 { text-decoration: underline; }
@media (max-width: 560px) { .handout-card { grid-template-columns: 5.5rem 1fr; gap: 0.85rem; padding: 0.85rem; } }
.hero-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
.hero-actions .hero-cta { margin-top: 0; }
