<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<meta property="og:site_name" content="Grave and Seed">
<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}Grave and Seed">
<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}Celebrations of life in Ann Arbor, planned plainly and held with care.{% endif %}">
<meta property="og:url" content="https://graveandseed.com{{ page.url | replace: 'index.html', '' }}">
<meta property="og:image" content="https://graveandseed.com/assets/share.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one plain column like a well-kept notebook; a soil band at the top, a seed-row of event styles, contact at the end. */
:root {
  color-scheme: light;
  --paper: #EDEFE9;
  --ink: #1D221E;
  --muted: #59625A;
  --soil: #2B2620;
  --soil-ink: #ECE7DE;
  --moss: #4E6B3A;
  --line: #CBD1C6;
  --field: #F7F8F4;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --label: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #171A17; --ink: #E4E7E1; --muted: #A2AA9F; --soil: #0F0E0C; --soil-ink: #E9E3D8;
    --moss: #9DB97F; --line: #343A33; --field: #20241F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #171A17; --ink: #E4E7E1; --muted: #A2AA9F; --soil: #0F0E0C; --soil-ink: #E9E3D8;
  --moss: #9DB97F; --line: #343A33; --field: #20241F; color-scheme: dark;
}
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1.08rem/1.6 var(--body); }
.wrap { max-width: 44rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--moss); }
.label { font: 500 0.72rem/1 var(--label); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

header.soil { background: var(--soil); color: var(--soil-ink); }
header.soil .wrap { padding-block: 1.5rem 3rem; display: grid; gap: 1.25rem; }
.mark { display: flex; align-items: center; gap: 0.6rem; font: 500 0.78rem/1 var(--label); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.8; }
.mark svg { width: 22px; height: 22px; }
header h1 { font-size: clamp(2.6rem, 9vw, 4.4rem); font-weight: 700; letter-spacing: -0.02em; }
header .lede { font-size: 1.25rem; max-width: 34rem; }
header .lede em { font-style: italic; color: #B9CF9E; }

main .wrap { display: grid; gap: 3.5rem; padding-block: 3rem 4rem; }
section { display: grid; gap: 1rem; }
section h2 { font-size: 1.9rem; font-weight: 700; }
.plain { display: grid; gap: 0.9rem; max-width: 36rem; }

.styles { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.style { padding-block: 1.1rem; border-bottom: 1px solid var(--line); display: grid; gap: 0.35rem; min-width: 0; }
.styles .style:nth-child(odd) { padding-right: 1.25rem; }
.style h3 { font-size: 1.3rem; font-weight: 500; }
.style p { color: var(--muted); font-size: 1rem; }

.tiers { display: grid; gap: 0; border-top: 1px solid var(--line); }
.tier { display: grid; grid-template-columns: 11rem 1fr; gap: 1rem; padding-block: 1rem; border-bottom: 1px solid var(--line); }
.tier h3 { font-size: 1.1rem; font-weight: 500; }
.tier .lead { display: block; margin-top: 0.35rem; }
@media (max-width: 560px) { .tier { grid-template-columns: 1fr; gap: 0.3rem; } .styles .style:nth-child(odd) { padding-right: 0; } }

.contact { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 1.5rem; display: grid; gap: 1.25rem; }
.email { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
.email code { font: 500 1rem/1.4 var(--label); user-select: all; }
.phone { font: 500 1rem/1.4 var(--label); }
.err { color: #A33A2A; font-weight: 600; }
button { font: 600 0.95rem/1 var(--body); border-radius: 4px; cursor: pointer; }
.copy { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 0.5rem 0.8rem; }
form { display: grid; gap: 0.9rem; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
label { display: grid; gap: 0.35rem; font-size: 0.95rem; min-width: 0; }
input, textarea { font: 400 1rem/1.4 var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 0.6rem 0.7rem; width: 100%; box-sizing: border-box; }
textarea { min-height: 7rem; resize: vertical; }
input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }
.send { justify-self: start; background: var(--moss); color: var(--paper); border: 0; padding: 0.8rem 1.2rem; }
.note { color: var(--muted); font-size: 0.95rem; }
.sent { color: var(--moss); font-weight: 600; }

footer .wrap { padding-block: 1.5rem 2.5rem; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem; }

.topnav { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.5rem 1.5rem; }
.topnav .brand { font: 700 1.05rem/1.2 var(--display); color: var(--soil-ink); text-decoration: none; }
.topnav .links { display: flex; flex-wrap: wrap; gap: 0.4rem 1.25rem; }
.topnav .links a { font: 500 0.78rem/1.6 var(--label); letter-spacing: 0.12em; text-transform: uppercase; color: var(--soil-ink); opacity: 0.8; text-decoration: none; }
.topnav .links a:hover, .topnav .links a[aria-current] { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
.hero-cta { display: inline-block; justify-self: start; margin-top: 0.25rem; padding: 0.7rem 1rem; border: 1px solid rgba(236,231,222,0.5); border-radius: 4px; color: var(--soil-ink); text-decoration: none; font-weight: 600; }
.hero-cta:hover { background: rgba(236,231,222,0.08); }

.budget { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 1.25rem 1.5rem; display: grid; gap: 0.75rem; }
.budget h3 { font-size: 1.3rem; font-weight: 500; }
.small { font-size: 0.92rem; color: var(--muted); }
dl.items { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem 1rem; margin: 0; }
dl.items dd { margin: 0; font-family: var(--label); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
dl.items .total { border-top: 1px solid var(--line); padding-top: 0.5rem; font-weight: 600; }
.tier .from { font-family: var(--label); font-variant-numeric: tabular-nums; font-size: 1rem; color: var(--moss); display: block; margin-top: 0.35rem; }

header.soil.slim .wrap { padding-block: 1.5rem 2.25rem; }
header.soil.slim h1 { font-size: clamp(2rem, 7vw, 3.2rem); }
.cards { display: grid; gap: 0; border-top: 1px solid var(--line); }
.card { display: grid; gap: 0.45rem; padding-block: 1.1rem; border-bottom: 1px solid var(--line); min-width: 0; }
.card h3 { font-size: 1.25rem; font-weight: 500; }
.card .meta { color: var(--muted); font-size: 0.95rem; }
.facts { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 0.3rem 1rem; margin: 0; font-size: 1rem; }
.facts dt { color: var(--muted); font: 500 0.72rem/1.9 var(--label); letter-spacing: 0.1em; text-transform: uppercase; }
.facts dd { margin: 0; }
@media (max-width: 560px) { .facts { grid-template-columns: 1fr; gap: 0.1rem; } .facts dd { margin-bottom: 0.4rem; } }
.tag { display: inline-block; font: 500 0.7rem/1 var(--label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--moss); border: 1px solid var(--moss); border-radius: 3px; padding: 0.25rem 0.4rem; margin-left: 0.4rem; vertical-align: middle; }
.box { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 1.25rem 1.5rem; display: grid; gap: 0.75rem; }
.prose { display: grid; gap: 0.9rem; max-width: 38rem; }
.prose h2 { margin-top: 0.5rem; }
.prose ul, .prose ol { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.5rem; }
.guides { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
.guide { display: grid; gap: 0.4rem; padding: 1.1rem 1.25rem; border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: var(--ink); background: var(--field); }
.guide:hover { border-color: var(--moss); }
.guide h3 { font-size: 1.2rem; font-weight: 500; color: var(--moss); }
ul.plain-list { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.5rem; max-width: 38rem; }
.addons-h { font-size: 1.3rem; font-weight: 500; margin-top: 0.75rem; }
.crisis { font-size: 0.98rem; opacity: 0.85; }
.crisis a { color: #B9CF9E; }
ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; border-top: 1px solid var(--line); }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 2.5rem 1fr; gap: 0 0.75rem; padding-block: 1rem; border-bottom: 1px solid var(--line); }
ol.steps li::before { content: counter(s); grid-row: span 2; font: 500 1rem/1.4 var(--label); color: var(--moss); }
ol.steps h3 { font-size: 1.1rem; font-weight: 500; }
ol.steps p { color: var(--muted); font-size: 1rem; }
.faq { border-top: 1px solid var(--line); }
.faq details { border-bottom: 1px solid var(--line); padding-block: 0.9rem; }
.faq summary { cursor: pointer; font: 500 1.1rem/1.3 var(--display); }
.faq summary::marker { color: var(--moss); }
.faq details p { margin-top: 0.6rem; max-width: 38rem; }
.book { font-weight: 600; flex-basis: 100%; }
</style>
