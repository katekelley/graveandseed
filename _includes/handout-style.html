<style>
:root { --ink: #2B1F17; --muted: #5A4C40; --rule: #B9AC98; }
* { box-sizing: border-box; }
html { background: #E9E2D6; }
body { margin: 0; color: var(--ink); font: 400 10.2pt/1.36 "Source Serif 4", Georgia, serif; }
.bar { display: flex; gap: 1rem; justify-content: center; align-items: center; padding: 14px; font: 600 15px/1 "Source Serif 4", Georgia, serif; }
.bar a { color: #3B2A20; }
.bar button { font: inherit; padding: 9px 16px; border: 1px solid #3B2A20; background: #FBF6EC; border-radius: 4px; cursor: pointer; }
.sheet { width: 8.5in; height: 11in; margin: 0 auto 40px; padding: 0.5in 0.55in 0.45in; background: #fff; box-shadow: 0 2px 14px rgba(0,0,0,.18); display: flex; flex-direction: column; overflow: hidden; }
.top { display: flex; justify-content: space-between; gap: 0.3in; align-items: flex-start; padding-bottom: 0.12in; border-bottom: 2px solid var(--ink); }
h1 { font: 600 24pt/1.05 "Fraunces", Georgia, serif; margin: 0 0 4pt; }
.sub { margin: 0; font-size: 11.5pt; color: var(--muted); }
.qrbox { display: flex; gap: 8pt; align-items: center; flex: none; max-width: 2.6in; }
.qr { width: 1.05in; height: 1.05in; flex: none; }
.qrbox p { margin: 0; font-size: 9.2pt; line-height: 1.3; }
.qrbox strong { display: block; font-size: 9.4pt; }
.cols { columns: 2; column-gap: 0.32in; column-rule: 1px solid #E3DACB; padding-top: 0.13in; flex: 1; }
section { break-inside: avoid; margin: 0 0 9pt; }
h2 { font: 600 12.6pt/1.15 "Fraunces", Georgia, serif; margin: 0 0 3pt; }
ul { margin: 0; padding-left: 1.05em; }
li { margin: 0 0 3pt; }
li::marker { color: var(--muted); }
p { margin: 0 0 3pt; }
.nw { white-space: nowrap; }
.sheet + .sheet { break-before: page; }
.back h2.big { font: 600 18pt/1.1 "Fraunces", Georgia, serif; margin: 0 0 3pt; }
.back .lead { margin: 0 0 10pt; color: var(--muted); font-size: 10.6pt; }
table.prices { width: 100%; border-collapse: collapse; font-size: 10.2pt; margin: 0 0 6pt; }
table.prices th, table.prices td { text-align: left; vertical-align: top; padding: 5pt 6pt 5pt 0; border-bottom: 1px solid var(--rule); }
table.prices thead th { font: 600 8.6pt/1.2 "Source Serif 4", Georgia, serif; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 1.5px solid var(--ink); }
table.prices td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 2pt; }
table.prices thead th.num { text-align: right; padding-right: 2pt; }
table.prices .who { font-weight: 600; }
table.prices .meta { display: block; color: var(--muted); font-size: 8.8pt; }
.small { font-size: 8.8pt; color: var(--muted); margin: 0 0 9pt; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0.32in; margin-top: 4pt; align-items: start; }
.box { border: 1px solid var(--rule); padding: 8pt 10pt; border-radius: 3px; }
.back h3 { font: 600 11.6pt/1.15 "Fraunces", Georgia, serif; margin: 0 0 4pt; }
.back ul.plain { list-style: none; padding: 0; margin: 0; }
.back ul.plain li { margin: 0 0 3pt; }
.spacer { flex: 1; }
.foot { border-top: 1px solid var(--rule); padding-top: 5pt; font-size: 8.4pt; color: var(--muted); display: flex; justify-content: space-between; gap: 12pt; }
@media screen and (max-width: 860px) {
  .two { grid-template-columns: 1fr; }
  table.prices { font-size: 14px; }
  .sheet { width: auto; height: auto; margin: 0 10px 30px; padding: 22px 18px; overflow: visible; }
  .top { flex-direction: column; }
  .cols { columns: 1; }
  body { font-size: 15px; }
  .foot { flex-direction: column; }
}
@media print {
  @page { size: letter; margin: 0; }
  html, body { background: #fff; }
  .bar { display: none; }
  .sheet { margin: 0; box-shadow: none; }
}
/* Worksheets: write-in lines and boxes that print without background graphics */
.ws h1 { font-size: 26pt; }
.row { display: flex; gap: 0.25in; align-items: flex-end; margin: 0 0 4pt; }
.row .f { flex: 1; }
.f { margin: 0 0 5pt; }
.f > .lbl { display: block; font-weight: 600; font-size: 9.8pt; margin: 0 0 1pt; }
.f > .hint { display: block; font-size: 8.6pt; color: var(--muted); margin: -1pt 0 1pt; }
.ln { height: 0.29in; border-bottom: 1px solid var(--rule); }
.row .f .ln, .inline .ln { height: 0.26in; }
.checks { display: flex; flex-wrap: wrap; gap: 3pt 12pt; margin: 2pt 0 5pt; font-size: 10pt; }
.cb { white-space: nowrap; }
.cb::before { content: ""; display: inline-block; width: 8.5pt; height: 8.5pt; border: 1px solid var(--ink); border-radius: 1.5pt; margin-right: 4pt; vertical-align: -1pt; }
.ws section { margin: 0 0 8pt; }
.ws h2 { font-size: 13pt; margin: 0 0 4pt; padding-bottom: 2pt; border-bottom: 1px solid var(--ink); }
.ws .cols section { break-inside: avoid; }
.note { font-size: 8.8pt; color: var(--muted); margin: 3pt 0 0; }
.notebox { border: 1px solid var(--rule); border-radius: 3px; padding: 6pt 9pt 2pt; }
table.ws-table { width: 100%; border-collapse: collapse; font-size: 9.8pt; }
table.ws-table th { text-align: left; font: 600 8.4pt/1.2 "Source Serif 4", Georgia, serif; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 1.5px solid var(--ink); padding: 3pt 6pt 3pt 0; }
table.ws-table td { border-bottom: 1px solid var(--rule); height: 0.3in; padding: 0 6pt 0 0; vertical-align: bottom; }
table.ws-table td.cbcell { width: 0.45in; text-align: center; }
table.ws-table td.cbcell::before { content: ""; display: inline-block; width: 8.5pt; height: 8.5pt; border: 1px solid var(--ink); border-radius: 1.5pt; margin-bottom: 4pt; }
table.ws-table .time { width: 0.8in; }
table.ws-table .who { width: 1.9in; }
@media screen and (max-width: 860px) {
  .row { flex-direction: column; align-items: stretch; gap: 0; }
}
</style>
