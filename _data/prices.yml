owners_note: "Owners are from each funeral home's Michigan license record, checked November 6, 2026."
intro: "Funeral prices in Washtenaw County vary a lot, and half the funeral homes here don't post them online. These come from each funeral home's price list, with the date I checked. Some post their lists online; for the others, I asked for a copy. Always confirm with the funeral home before deciding."
