hero_heading: "Your guide through goodbye."
tagline_start: "Celebrations of life and memorials in Ann Arbor"
tagline_emphasis: ""
location: "Ann Arbor, Michigan"
meta_description: "Celebration of life planning in Ann Arbor and Washtenaw County, with posted prices and free local guides for the first days after a death."
crisis_note: "If someone just died and you don't know where to start:"
crisis_link_text: "here's the first week"

intro_heading: "Someone died. Let's gather the people who loved them."
intro:
  - "I plan and run celebrations of life so you can be present at your own gathering instead of managing it. Venues, food, music, photos, the order of the day, the folding chairs."
  - "I won't rush you, and I won't hand you a script full of soft words. If you need to sit for an hour before we talk logistics, we'll sit."
  - "Chosen family is family. If you're the friends who are throwing the party, I'm glad to work with you."

styles_heading: "Event styles"
styles:
  - name: "The Long Table"
    link: "/celebrations/long-table/"
    description: "A shared meal, one long table, and time for stories."
  - name: "A Proper Send-Off"
    link: "/celebrations/proper-send-off/"
    description: "Toasts, a loud room and the songs they'd have picked."
  - name: "Chosen Kin"
    link: "/celebrations/chosen-kin/"
    description: "A celebration run by friends, on your terms, separate from any official service."
  - name: "Last Roll"
    link: "/celebrations/last-roll/"
    description: "For the gamers and the fans: dice, character sheets and the campaign recap."

offer_heading: "Planning, from start to finish or just the day"
tiers:
  - name: "Full planning"
    description: "Concept, venue, vendors, décor and running the day."
    timing: "Best with 3+ weeks"
    price_from: 2100
  - name: "Partial planning"
    description: "You've started. I fill the gaps and run the day."
    timing: "Best with 2+ weeks"
    price_from: 1250
  - name: "Day-of coordination"
    description: "You have the plan. I make it happen so you don't have to."
    timing: "Short notice is fine"
    price_from: 850
pricing_note: "These are starting prices for a two-hour celebration. Larger or more complex days cost more, and I'll give you a clear written quote after a short conversation."
paperwork_heading: "Company while you do the paperwork"
paperwork: "Plenty of people know what they want but put off writing it down, because it feels heavy to do alone. I'll sit with you while you fill out your own planning papers, like Five Wishes, a patient advocate designation or your wishes for your own celebration. I'll keep us on track, explain what each section is asking, and leave you with a list of what still needs signing, and by whom. The choices and the words are yours."
paperwork_note: "I'm not a lawyer, and this isn't legal or medical advice. For a will, finances or anything complicated, I'll point you to an estate planning attorney."

celebrant_heading: "Leading the service"
celebrant: "Already working with a funeral home, or just need someone to lead the ceremony? I can be your celebrant: a secular officiant who leads a memorial or funeral built around the person, not a script. We meet so I can hear the stories, I write the service and send you a draft to change as much as you like, and on the day I hold the room so your family can just be there. Religious readings, prayers and hymns are welcome if you want them; I'm also glad to share the service with your clergy."
celebrant_price_from: 400
celebrant_note: "Includes a family meeting, a written service with a round of edits, coordinating with your funeral home or venue, and leading the service. If I'm already planning your celebration, see the add-on below."

contact_heading: "Tell me who you're remembering"
email: "kate@graveandseed.com"
phone: "(734) 489-9915"
phone_note: "Texts welcome"
reply_note: "I reply by email, usually within a day or two."
booking_url: "https://calendar.app.google/5Ux8HTXQVVPzKPsY7"
booking_text: "Or book a free 20-minute call"

steps_heading: "How it works"
steps:
  - name: "A free call"
    description: "Twenty minutes, by phone or video. Tell me about the person and what you're picturing. No pressure to decide anything."
  - name: "A written proposal"
    description: "Within a few days, a plan and a clear price, including what you'll pay vendors directly."
  - name: "A deposit to hold the date"
    description: "Half the planning fee holds your date. The rest is due a week before the celebration."
  - name: "Planning together"
    description: "As many check-ins as you want, or as few. I handle venues, vendors and the order of the day."
  - name: "The day itself"
    description: "I arrive first, leave last, and keep things moving so you can be with your people."

faq_heading: "Questions people ask"
faq:
  - q: "How soon can you plan something?"
    a: "Day-of coordination can come together in about a week. For full planning, three weeks or more is best. Many families hold the celebration a month or two after the death, especially after a direct cremation, and that's completely fine."
  - q: "Do I still need a funeral home?"
    a: "In Michigan, yes. A licensed funeral director has to handle the body, the death certificate and the permits. I don't do any of that. I plan the gathering, which can be separate and happen later, anywhere. I'm happy to help you compare funeral home prices."
  - q: "Can you help write the obituary?"
    a: "Yes, and you don't need to book anything else. We talk for about an hour, and within about two days I send a long version for online and a short one for the newspaper. If you'd rather write it yourself, <a href='/resources/obituary/'>my free guide</a> walks you through it."
  - q: "Is it religious?"
    a: "Only if you want it to be. I plan secular, religious and mixed celebrations, and I can lead the service myself as a secular celebrant, or work alongside your clergy."
  - q: "Can friends hire you, not just family?"
    a: "Yes. Chosen family, roommates, a band, a gaming group, a group of coworkers. If you're the people throwing the party, I'll work with you."
  - q: "How do payment and cancellation work?"
    a: "Half the planning fee holds your date and the rest is due a week before. If plans change, I'll refund the deposit minus time already spent and any vendor costs that can't be refunded. Life is unpredictable right now; I'll be reasonable."
  - q: "Where do you work?"
    a: "Ann Arbor, Ypsilanti and the rest of Washtenaw County. I'll travel farther for a mileage fee."
  - q: "Can we have alcohol?"
    a: "Yes, served by a licensed caterer or the venue's bar. I can help you find one."

about_heading: "I'm Kate, and I guide people through saying goodbye."
about:
  - "I'm direct. I'll tell you what things cost, what you actually need, and what you can skip. I'm also not in a hurry. If you want to sit and talk about the person before we talk about chairs, all the better."
  - "By day I'm a structural engineer, which mostly means I like a plan and I notice details. Chosen family, unconventional families, and people who want something that doesn't look like a funeral are all welcome here."

kit_heading: "What I bring"
kit_intro: "Every celebration starts from my own collection, so you're not renting or buying décor for one afternoon."
kit_items:
  - "Silk flowers and greenery garlands"
  - "Table runners and vintage tablecloths"
  - "Glass candleholders"
  - "Wooden slab centerpiece risers"
kit_note: "Ask on your free call what would suit your gathering."
kit_caption: "From a May Day gathering, set with pieces from my collection."

addons_heading: "Add-ons"
addons:
  - name: "Leading the ceremony"
    price_from: 250
    description: "I'll be your celebrant (a secular officiant) as well as your planner: I write the order of the service, tie together the stories, readings and music, and lead it on the day, so no one in the family has to stand up and hold it together."
  - name: "Story corner"
    price_from: 350
    description: "A quiet corner at the celebration where guests sit and tell a story about the person on camera, with someone there to help. Afterward I edit each story and deliver them on a USB drive and in a private online folder for the family."
  - name: "Story phone"
    price_from: 150
    description: "A vintage-style phone guests pick up to leave a spoken message or memory. Gentler for people who don't want to be on camera. The family gets every message as an audio file."
  - name: "Flower table"
    price_from: 200
    description: "Buckets of fresh flowers, shears and mismatched bud vases, so guests can make a small arrangement during the gathering and take it home. I order, prep and set up the flowers; you pay for them at cost, usually $100 to $200 for 50 guests. Needs about a week's notice."
  - name: "Photo memory table"
    price_from: 300
    description: "Send me boxes, albums or phone photos. I scan and choose them with you, print a display for the room and make a slideshow to play during the gathering. The family keeps all the scans."
  - name: "Memory cards book"
    price_from: 150
    description: "Instead of a guest book, cards that ask guests for a story or a memory. Afterward I bind them into a book for the family. Printing is extra."
  - name: "Livestream"
    price_from: 150
    description: "For family who can't be there. A steady camera, good sound and someone watching the stream, with a private link and a recording afterward."
  - name: "Obituary writing"
    price_from: 175
    description: "An hour with your family, by phone or in person, to ask the questions that get at who they were. Within about two days I write a long version for online and a short one for print, with a round of edits. Available on its own, without booking anything else."
  - name: "Invitations and program"
    price_from: 200
    description: "A simple invitation with an online RSVP, and a printed program with the order of the day, photos and readings. Printing is extra."
  - name: "Seed packet keepsakes"
    price_from: 125
    description: "Packets of Michigan wildflower seeds printed with their name, for guests to take home and plant. Seeds and printing are extra."
  - name: "Kids' table"
    price_from: 100
    description: "A quiet table with drawing, a memory jar and simple crafts, so grieving kids have somewhere to be. I can share local children's grief resources with the family afterward."
