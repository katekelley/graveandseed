terms:
  - term: "Grave, plot, lot or burial right"
    meaning: "You don't buy the land. You buy the right to be buried in one spot. Some cemeteries let one grave hold a casket plus a set of ashes, or two sets of ashes."
  - term: "Opening and closing (interment)"
    meaning: "The fee to dig the grave, lower the casket or urn, fill the grave back in and fix the ground. It's charged at the time of burial, on top of the grave price. It costs more on Saturdays and late in the day."
  - term: "Vault or grave liner"
    meaning: "A concrete or steel box around the casket that keeps the ground from sinking. No Michigan law requires one, but many cemeteries do. You usually buy it from the funeral home or a vault company, not the cemetery, so it won't show up on the cemetery's price list."
  - term: "Marker, headstone and foundation"
    meaning: "A flat marker lies level with the grass. An upright headstone stands up and is only allowed in some sections. Most cemeteries pour a concrete base under the stone themselves and charge for it. Many won't pour bases in winter."
  - term: "Niche or columbarium"
    meaning: "A space for an urn in a wall or cabinet built for ashes. The price often includes placing the urn and a nameplate."
  - term: "Perpetual care or endowment care"
    meaning: "Part of the grave price goes into a fund that pays for mowing and upkeep for good. At Forest Hill it's 15%."
  - term: "Transfer or deed fee"
    meaning: "What you pay to put a grave you already own in someone else's name."
  - term: "Buyback"
    meaning: "Whether the cemetery will refund a grave you no longer need. Many won't. If you're buying ahead, ask before you pay."
  - term: "Disinterment"
    meaning: "Moving someone who is already buried. It usually costs more than the first burial."
