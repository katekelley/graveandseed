updated: "November 11, 2026"
intro: "A burial has two bills: one from the funeral home and one from the cemetery. Cemeteries don't have to give you a price list the way funeral homes do, and their prices come in pieces that only make sense added up. These are the prices Ann Arbor and Ypsilanti cemeteries post online, with the date I checked. Always confirm with the cemetery before you buy."
