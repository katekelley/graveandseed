intro: "Most of us never see these things until we're asked to pay for them. Here's what they are and what they look like, so nothing at the funeral home is a surprise."
sections:
  - heading: Caskets and containers
    items:
      - term: Casket
        aka: ""
        image: "/assets/dictionary/casket.jpg"
        alt: White roses on the lid of a polished wooden casket at a cemetery
        credit: Getty Images on Unsplash+
        credit_url: "https://unsplash.com/photos/gw91MHgbkt8"
        description: "A box for burial or viewing, usually metal or wood with a cloth lining. It's often the most marked-up thing a funeral home sells. You can buy one elsewhere, and the funeral home has to accept it."
        link: /resources/caskets/
        link_text: Caskets and lower-cost options
      - term: Coffin
        aka: ""
        image: "/assets/dictionary/coffin.jpg"
        alt: A polished wooden coffin, wider at the shoulders and narrow at the feet
        credit: Ivo Santos on Unsplash
        credit_url: "https://unsplash.com/photos/Scij5JjDstA"
        description: "People often use the words for the same thing, but a coffin has six sides: wider at the shoulders and narrower at the head and feet. They're common in Europe. Most funeral homes here sell rectangular caskets."
        link: ""
        link_text: ""
      - term: Rental casket
        aka: Ceremonial casket
        image: "/assets/dictionary/rental-casket.jpg"
        alt: "A wooden rental casket with the lid open and the inner tray sliding out of the foot end"
        credit: "Chad Eversole, CC BY-SA 3.0"
        credit_url: "https://commons.wikimedia.org/wiki/File:Starmark-footenddoor-RENTAL-CASKET.png"
        description: "A nice outer casket used only for a viewing or service before cremation. The body rests on a removable insert, and the insert goes to the crematory. At Muehlig, renting one costs $1,100."
        link: ""
        link_text: ""
      - term: Cremation container
        aka: Alternative container
        image: ""
        alt: ""
        credit: ""
        credit_url: ""
        description: "A simple box, usually heavy cardboard, that holds the body during cremation. No law requires a casket for cremation. This is all you need."
        link: /prices/
        link_text: Compare cremation prices
      - term: Cardboard coffin
        aka: ""
        image: "/assets/dictionary/cardboard-coffin.jpg"
        alt: A cardboard coffin covered in handwritten messages and flowers
        credit: The Good Funeral Guide on Unsplash
        credit_url: "https://unsplash.com/photos/n01GmOCropI"
        description: "A sturdier, nicer cardboard box made for burial or a service. Some families decorate it or write messages on it."
        link: ""
        link_text: ""
      - term: Willow casket
        aka: Woven casket
        image: "/assets/dictionary/willow-casket.jpg"
        alt: A woven willow casket on wooden stands outdoors, with flowers on top
        credit: Dead Good Legacies on Unsplash
        credit_url: "https://unsplash.com/photos/LLfq1aIcMBg"
        description: "Woven from willow or other plants. It breaks down in the soil, so it's a common choice for green burial. One is made near Dexter."
        link: /resources/green-burial/
        link_text: Green burial in Michigan
      - term: Shroud
        aka: ""
        image: ""
        alt: ""
        credit: ""
        credit_url: ""
        description: "A cloth wrap for the body, often used for green burial instead of a casket. A favorite quilt or blanket can work. Ask the cemetery what it allows."
        link: /resources/caskets/
        link_text: Where to find one
      - term: Church truck
        aka: Casket carriage, bier
        image: "/assets/dictionary/church-truck-ferno.jpg"
        alt: "A bronze-colored folding metal frame on four large rubber wheels, with handles at each end"
        fit: contain
        label: "A church truck for the cemetery, with big wheels for grass."
        credit: FERNO Group
        credit_url: "https://www.ferno.com/product/cemetery-church-truck"
        image2: "/assets/dictionary/church-truck.jpg"
        alt2: "A wheeled cart with a black fabric skirt and a steel frame on top, in a chapel"
        label2: "One in a chapel, with its skirt on."
        credit2: "Cherubino, CC BY-SA 3.0"
        credit_url2: "https://commons.wikimedia.org/wiki/File:Friedhofskapelle_Butzbach_19.JPG"
        description: "A folding stand on wheels that holds the casket at a funeral, visitation or graveside service. It's often hidden under a skirt of fabric. It lets staff move the casket without carrying it."
        link: ""
        link_text: ""
      - term: Showroom truck
        aka: Casket display stand
        image: "/assets/dictionary/showroom-truck-ferno.jpg"
        alt: "A low, open frame of polished metal tubes on four wheels"
        fit: contain
        credit: FERNO Group
        credit_url: "https://www.ferno.com/product/model-112-showroom-truck"
        image2: "/assets/dictionary/showroom.jpg"
        alt2: "A carpeted funeral home room with open caskets displayed on low stands"
        label2: "Caskets on stands in a selection room."
        credit2: "Wolfdog406, CC BY-SA 4.0"
        credit_url2: "https://commons.wikimedia.org/wiki/File:A_casket_showroom_in_Billings,_Montana.jpg"
        description: "A low stand that holds a casket in the funeral home's selection room so you can see it at full size. You don't have to buy a casket you see on display, and you can bring in one from somewhere else."
        link: ""
        link_text: ""
  - heading: Ashes
    items:
      - term: Cremated remains
        aka: Ashes, cremains
        image: ""
        alt: ""
        credit: ""
        credit_url: ""
        description: "Not soft like fireplace ash. They're bone ground into a coarse, gray-white grit, a bit like sand. An adult's usually weighs a few pounds, heavier than most people expect."
        link: ""
        link_text: ""
      - term: Temporary urn
        aka: Temporary container
        image: ""
        alt: ""
        credit: ""
        credit_url: ""
        description: "The plain black plastic box ashes come home in, with the ashes in a sealed bag inside. It's fine to keep them in it as long as you like. It's also the best container for getting through airport security."
        link: ""
        link_text: ""
      - term: Urn
        aka: ""
        image: ""
        alt: ""
        credit: ""
        credit_url: ""
        description: "Any container you choose for ashes. Funeral homes sell them, but you can buy one anywhere, use a box or jar that meant something to the person, or skip it."
        link: ""
        link_text: ""
      - term: Scattering tube
        aka: ""
        image: ""
        alt: ""
        credit: ""
        credit_url: ""
        description: "A cardboard tube with a pull-off top, made for scattering ashes. Michigan has no state law on where you scatter, but you need the landowner's permission."
        link: ""
        link_text: ""
      - term: Columbarium niche
        aka: ""
        image: "/assets/dictionary/columbarium.jpg"
        alt: A wood-paneled room with rows of small niches with name plates, lit by a window
        credit: Brunxs on Unsplash
        credit_url: "https://unsplash.com/photos/zCjNb6_AAQc"
        description: "A small space in a wall or building for an urn, usually with a name plate on the front. Many cemeteries sell them."
        link: /cemeteries/
        link_text: What cemeteries cost
  - heading: At the cemetery
    items:
      - term: Burial vault
        aka: Outer burial container
        image: "/assets/dictionary/vault.jpg"
        alt: "An open grave with a white concrete vault set in it, waiting for the casket"
        credit: "Robert Lawton, CC BY-SA 2.5"
        credit_url: "https://commons.wikimedia.org/wiki/File:Fresh_grave.JPG"
        description: "A concrete box, sealed with a lid, set in the grave before the casket goes in. No law requires one, but most cemeteries do, so the ground stays level for mowing."
        link: /cemeteries/
        link_text: What cemeteries cost
      - term: Grave liner
        aka: ""
        image: ""
        alt: ""
        credit: ""
        credit_url: ""
        description: "A cheaper concrete box that does the same job as a vault, but isn't sealed. If your cemetery requires an outer container, a liner usually meets the rule."
        link: ""
        link_text: ""
      - term: Lowering device
        aka: ""
        image: ""
        alt: ""
        credit: ""
        credit_url: ""
        description: "The metal frame with straps that sits over the grave and lowers the casket slowly. It's often covered with green cloth or artificial grass."
        link: ""
        link_text: ""
  - heading: Moving someone
    items:
      - term: Cot
        aka: Stretcher, removal cot
        image: "/assets/dictionary/cot-ferno.jpg"
        alt: "A metal stretcher on wheels with a thin burgundy mattress and two black straps"
        fit: contain
        credit: FERNO Group
        credit_url: "https://www.ferno.com/product/model-23-mortuary-cot"
        description: "What the funeral home brings to take someone from a home or hospital. The body is covered, usually with a quilted cover. If someone dies at home, you can ask for a few minutes before they arrive, or to walk out with them."
        link: /resources/first-week/
        link_text: The first week
      - term: Pouch
        aka: Body bag, first call pouch
        image: "/assets/dictionary/body-bag-ferno.jpg"
        alt: "An empty white plastic body bag laid flat, with a long black zipper curving around the top"
        fit: contain
        bg: "#000"
        label: "A plastic body bag."
        credit: FERNO Group
        credit_url: "https://www.ferno.com/us/product/heavy-duty-body-bag-in-blue"
        image2: "/assets/dictionary/first-call-pouch-ferno.jpg"
        alt2: "A burgundy cloth cover zipped over the top of a cot, shaped like a long box"
        fit2: contain
        label2: "A cloth cot cover, sometimes called a first call pouch."
        credit2: FERNO Group
        credit_url2: "https://www.ferno.com/product/first-call-pouch"
        description: "A heavy zippered bag used to move someone. Hospitals and the medical examiner often use one. For deaths at home, many funeral homes use only the cot cover. If you're there, you can ask that they not zip your person into a bag in front of you, or that they use a family quilt instead."
        link: /resources/first-week/
        link_text: The first week
      - term: Hearse
        aka: Funeral coach
        image: "/assets/dictionary/hearse.jpg"
        alt: A willow casket with flowers in the back of a hearse
        credit: The Good Funeral Guide on Unsplash
        credit_url: "https://unsplash.com/photos/DzLRoqZOYqw"
        description: "The vehicle that carries the casket to the service or cemetery. It's usually a separate charge, and you can say no to it."
        link: ""
        link_text: ""
      - term: Air tray
        aka: ""
        image: ""
        alt: ""
        credit: ""
        credit_url: ""
        description: "A wood base with a heavy cardboard cover, used to ship a casket on a plane. At Muehlig, it's $195."
        link: /resources/died-away-from-home/
        link_text: When someone dies far from home
      - term: Cremated remains box
        aka: ""
        image: ""
        alt: ""
        credit: ""
        credit_url: ""
        description: "The Postal Service box you have to use to mail ashes. Every side is printed with an orange \"Cremated Remains\" label. The kit is free."
        link: /resources/died-away-from-home/
        link_text: How to mail ashes
behind_heading: Behind the door
behind_note: "These are part of what happens at a funeral home or crematory. Most of them are used only if the family agrees to embalming. Some people find it helps to know; others would rather not. Open this only if you want to."
behind:
  - term: Dressing table
    aka: Preparation table, embalming table, operating table
    image: "/assets/dictionary/dressing-table-ferno.jpg"
    alt: "A long, narrow gray table on folding metal legs with four wheels"
    fit: contain
    label: "A folding dressing table."
    credit: FERNO Group
    credit_url: "https://www.ferno.com/product/model-34-folding-dressing-table"
    image2: "/assets/dictionary/operating-table-ferno.jpg"
    alt2: "A stainless steel table with raised edges and side panels, on a pedestal base with foot pedals"
    fit2: contain
    label2: "A steel operating table, used for embalming."
    credit2: FERNO Group
    credit_url2: "https://www.ferno.com/product/model-101-h-hydraulic-table"
    description: "A table where staff wash and dress the person. Embalming, if the family asked for it, is done on a steel table that tilts so fluids drain away."
    link: ""
    link_text: ""
  - term: Cooler
    aka: Refrigeration
    image: "/assets/dictionary/cooler.jpg"
    alt: "A white wall with three insulated refrigerator doors with steel handles"
    credit: "Daniel Capilla, CC BY-SA 4.0"
    credit_url: "https://commons.wikimedia.org/wiki/File:Mortuary_Refrigerator_of_the_San_Miguel_Cemetery.jpg"
    description: "A walk-in or cabinet refrigerator that keeps a body cool until burial or cremation. It's the normal alternative to embalming."
    link: /resources/embalming/
    link_text: Is embalming required?
  - term: Embalming tools
    aka: ""
    image: "/assets/dictionary/embalming-tools.jpg"
    alt: "Steel clamps, scissors, a curved needle and other instruments laid out on a pad"
    credit: "Vladimir S, CC BY-SA 4.0"
    credit_url: "https://commons.wikimedia.org/wiki/File:Utensils_used_for_embalming.jpg"
    description: "Clamps, scissors, curved needles and small tubes, a lot like a surgeon's tools. They're used to reach an artery and a vein, and to stitch the openings closed afterward."
    link: "/resources/embalming/"
    link_text: "Is embalming required?"
  - term: Embalming machine
    aka: "Embalming pump"
    image: ""
    alt: ""
    credit: ""
    credit_url: ""
    description: "A pump with a tank on top. It pushes about two gallons of embalming fluid into an artery while blood drains out of a nearby vein."
    link: "/resources/embalming/"
    link_text: "Is embalming required?"
  - term: Eye caps
    aka: ""
    image: ""
    alt: ""
    credit: ""
    credit_url: ""
    description: "Thin, curved pieces of plastic with a rough surface. They go under the eyelids to keep them closed and looking full. Sometimes glue is used instead or as well."
    link: "/resources/embalming/"
    link_text: "Is embalming required?"
  - term: Needle injector
    aka: "Mouth closure"
    image: ""
    alt: ""
    credit: ""
    credit_url: ""
    description: "A tool that sets small wires into the upper and lower jaw, which are then twisted together to hold the mouth closed. Some embalmers stitch the mouth closed instead. A plastic mouth former shapes the lips."
    link: "/resources/embalming/"
    link_text: "Is embalming required?"
  - term: Trocar
    aka: ""
    image: ""
    alt: ""
    credit: ""
    credit_url: ""
    description: "A long, pointed metal tube attached to a suction hose. It goes in near the navel to drain fluid and gas from the organs in the chest and belly, and then cavity fluid goes in through it."
    link: /resources/embalming/
    link_text: Is embalming required?
  - term: Embalming fluid
    aka: "Cavity fluid"
    image: "/assets/dictionary/embalming-fluid.jpg"
    alt: "Old glass bottles of embalming fluid on a wooden shipping crate, in a museum"
    credit: "Mycota, public domain"
    credit_url: "https://commons.wikimedia.org/wiki/File:Embalming_fluid.jpg"
    description: "Usually formaldehyde or a similar chemical mixed with water. A stronger kind, called cavity fluid, goes into the chest and belly. These old bottles are in a museum; today's look much the same."
    link: "/resources/embalming/"
    link_text: "Is embalming required?"
  - term: Tissue builder
    aka: "Feature builder, filler"
    image: ""
    alt: ""
    credit: ""
    credit_url: ""
    description: "A filler injected under the skin where the face has sunk, often around the eyes, cheeks and temples. If you'd rather they look like themselves after an illness, you can ask the funeral home not to use it."
    link: "/resources/embalming/"
    link_text: "What embalming involves"
  - term: Restorative wax and cosmetics
    aka: ""
    image: "/assets/dictionary/restorative.jpg"
    alt: "A museum case of old mortuary makeup, wax and small tools"
    credit: "Robert Lawton, CC BY-SA 2.5"
    credit_url: "https://commons.wikimedia.org/wiki/File:Mortician%27s_resorative_tools.JPG"
    description: "Wax to shape or rebuild features, and makeup for the face and hands. This museum display shows older versions. It's the last step before dressing and casketing."
    link: "/resources/embalming/"
    link_text: "Is embalming required?"
  - term: Retort
    aka: Cremation chamber
    image: "/assets/dictionary/retort.jpg"
    alt: "A large stainless steel cremation chamber with a control panel, in Frankfurt, Germany"
    credit: "Dontworry, CC BY-SA 3.0"
    credit_url: "https://commons.wikimedia.org/wiki/File:Hauptfriedhof-ffm-krematoriums-ofen-ausgang-001.jpg"
    description: "The large brick-lined oven where cremation happens. From the outside it looks like an industrial furnace with a steel door. Some crematories let family members be there when it starts."
    link: ""
    link_text: ""
