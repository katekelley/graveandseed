content:
  - name: site
    label: Website text
    type: file
    path: _data/content.yml
    fields:
      - { name: tagline_start, label: Tagline (plain part), type: string }
      - { name: tagline_emphasis, label: Tagline (italic ending), type: string }
      - { name: location, label: Location, type: string }
      - { name: intro_heading, label: "How I work: heading", type: string }
      - { name: intro, label: "How I work: paragraphs", type: text, list: true }
      - { name: styles_heading, label: "Event styles: heading", type: string }
      - name: styles
        label: Event styles
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: description, label: Description, type: text }
      - { name: offer_heading, label: "Services: heading", type: string }
      - name: tiers
        label: Services
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: description, label: Description, type: text }
          - { name: timing, label: Timing note, type: string }
      - { name: pricing_note, label: Pricing note, type: text }
      - { name: contact_heading, label: "Contact: heading", type: string }
      - { name: email, label: Email, type: string }
      - { name: phone, label: Phone (leave blank to hide), type: string }
      - { name: phone_note, label: Phone note, type: string }
      - { name: reply_note, label: Reply note under the form, type: string }
