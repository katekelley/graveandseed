media:
  input: assets
  output: /assets
content:
  - name: site
    label: Website text
    type: file
    path: _data/content.yml
    fields:
      - { name: hero_heading, label: Home headline, type: string }
      - { name: tagline_start, label: Tagline (first part, regular text), type: string }
      - { name: tagline_emphasis, label: Tagline (italic ending), type: string }
      - { name: location, label: Location, type: string }
      - { name: meta_description, label: "Home: description Google shows under the title", type: text }
      - { name: crisis_note, label: "Home: 'someone just died' note", type: string }
      - { name: crisis_link_text, label: "Home: 'someone just died' link text", type: string }
      - { name: start_heading, label: "Start here: heading", type: string }
      - { name: start_intro, label: "Start here: intro", type: string }
      - { name: start_here, label: "Start here: guide links (each must match a link on the Resources page)", type: string, list: true }
      - { name: intro_heading, label: "How I work: heading", type: string }
      - { name: intro, label: "How I work: paragraphs", type: text, list: true }
      - { name: styles_heading, label: "Event styles: heading", type: string }
      - name: styles
        label: Event styles
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: link, label: Page link, type: string }
          - { name: description, label: Description, type: text }
      - { name: offer_heading, label: "Services: heading", type: string }
      - name: tiers
        label: Services
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: description, label: Description, type: text }
          - { name: timing, label: Timing note, type: string }
          - { name: price_from, label: Starting price ($), type: number }
      - { name: pricing_note, label: Pricing note, type: text }
      - { name: contact_heading, label: "Contact: heading", type: string }
      - { name: contact_intro, label: "Home: text under the contact heading", type: text }
      - { name: email, label: Email, type: string }
      - { name: phone, label: Phone (leave blank to hide), type: string }
      - { name: phone_note, label: Phone note, type: string }
      - { name: reply_note, label: Reply note under the form, type: string }
      - { name: facebook_url, label: Facebook page link (leave blank to hide), type: string }
      - { name: listing_urls, label: "Other listings (Yelp, Nextdoor, directories) - tells Google they're the same business", type: string, list: true }
      - { name: booking_url, label: Booking page link (leave blank to hide), type: string }
      - { name: booking_text, label: Booking link text, type: string }
      - { name: steps_heading, label: "How it works: heading", type: string }
      - name: steps
        label: How it works steps
        type: object
        list: true
        fields:
          - { name: name, label: Step, type: string }
          - { name: description, label: Description, type: text }
      - { name: faq_heading, label: "FAQ: heading", type: string }
      - name: faq
        label: FAQ
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }
      - { name: kit_heading, label: "What I bring: heading", type: string }
      - { name: other_heading, label: "Other ways I help: heading", type: string }
      - { name: paperwork, label: "Paperwork companion: description", type: text }
      - { name: after_paperwork, label: "Paperwork companion: after a death", type: text }
      - { name: paperwork_note, label: "Paperwork companion: not-legal-advice note", type: text }
      - { name: celebrant, label: "Celebrant: description", type: text }
      - { name: celebrant_price_from, label: "Celebrant: starting price ($)", type: number }
      - { name: celebrant_note, label: "Celebrant: what's included note", type: text }
      - { name: scatter, label: "Scattering ceremonies: description", type: text }
      - { name: scatter_price_from, label: "Scattering ceremonies: starting price ($)", type: number }
      - { name: kit_intro, label: "What I bring: intro", type: text }
      - { name: kit_items, label: "What I bring: items", type: string, list: true }
      - { name: kit_note, label: "What I bring: note under the list", type: text }
      - { name: kit_caption, label: "What I bring: photo caption", type: string }
      - { name: addons_heading, label: "Add-ons: heading", type: string }
      - { name: addons_more_label, label: "Add-ons: label for the short list of extras", type: string }
      - name: addons
        label: Add-ons
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: price_from, label: Starting price ($), type: number }
          - { name: featured, label: "Show in full (off = short list at the bottom)", type: boolean }
          - { name: description, label: Description, type: text }
      - { name: about_heading, label: "About: opening line", type: string }
      - { name: about_pronouns, label: "About: your pronouns (leave blank to hide)", type: string }
      - { name: about, label: "About: paragraphs", type: text, list: true }
  - name: resources
    label: Resources page guides
    type: file
    path: _data/resources.yml
    list: true
    fields:
      - { name: group, label: "Group (Someone just died / Planning a celebration / Costs and planning ahead / Printable handouts)", type: string }
      - { name: title, label: Title, type: string }
      - { name: blurb, label: Blurb, type: text }
      - { name: url, label: Link, type: string }
  - name: prices
    label: Funeral prices page
    type: file
    path: _data/prices.yml
    fields:
      - { name: updated, label: Date prices were checked, type: string }
      - { name: owners_note, label: Note on where owner info comes from, type: string }
      - { name: intro, label: Intro, type: text }
      - name: homes
        label: Funeral homes with posted prices (list from cheapest to most expensive direct cremation)
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: short, label: Short name for table, type: string }
          - { name: starting, label: Prices are 'starting at' prices, type: boolean }
          - { name: town, label: Town, type: string }
          - { name: phone, label: Phone, type: string }
          - { name: website, label: Link to their prices, type: string }
          - { name: posted, label: What they post, type: string }
          - { name: checked, label: Date checked, type: string }
          - { name: direct_cremation, label: Direct cremation ($), type: string }
          - { name: direct_cremation_note, label: Direct cremation note, type: text }
          - { name: immediate_burial, label: Immediate burial ($), type: string }
          - { name: burial_casket, label: Burial with their simplest casket ($), type: string }
          - { name: basic_services, label: Basic services fee ($), type: string }
          - { name: transfer, label: Transfer of remains ($), type: string }
          - { name: embalming, label: Embalming ($), type: string }
          - { name: visitation, label: Visitation ($), type: string }
          - { name: ceremony, label: Funeral ceremony ($), type: string }
          - { name: memorial, label: Memorial service ($), type: string }
          - { name: hearse, label: Hearse ($), type: string }
          - { name: owner_short, label: Owner (short; shown in the table), type: string }
          - { name: owner, label: Owner and home base, type: string }
          - { name: notes, label: Notes, type: text }
          - { name: yelp, label: Yelp page link, type: string }
          - { name: yelp_more, label: Second Yelp page link (optional), type: string }
      - name: not_posted
        label: Funeral homes without posted prices
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: town, label: Town, type: string }
          - { name: phone, label: Phone, type: string }
          - { name: status, label: Status, type: string }
          - { name: owner, label: Owner and home base, type: string }
          - { name: yelp, label: Yelp page link, type: string }
  - name: cemeteries
    label: Cemetery prices page
    type: file
    path: _data/cemeteries.yml
    fields:
      - { name: updated, label: Date prices were checked, type: string }
      - { name: intro, label: Intro, type: text }
      - name: cemeteries
        label: Cemeteries with posted prices (list from cheapest to most expensive grave plus opening)
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: short, label: Short name for table, type: string }
          - { name: town, label: Town, type: string }
          - { name: phone, label: Phone, type: string }
          - { name: website, label: Link to their prices, type: string }
          - { name: rules, label: Link to their rules, type: string }
          - { name: effective, label: Prices effective, type: string }
          - { name: checked, label: Date checked, type: string }
          - { name: run_by, label: Run by, type: string }
          - { name: vault, label: "Vault or liner required?", type: string }
          - { name: buyback, label: "Buys back unused graves?", type: string }
          - { name: sunday, label: "Sunday burials?", type: string }
          - { name: grave, label: Lowest-priced grave ($), type: string }
          - { name: open_weekday, label: Opening and closing weekday ($), type: string }
          - { name: open_saturday, label: Opening and closing Saturday ($), type: string }
          - { name: burial_total, label: Grave plus weekday opening ($), type: string }
          - { name: ashes_ground, label: Ashes in the ground lowest total ($), type: string }
          - { name: niche, label: Niche for ashes lowest total ($), type: string }
          - { name: notes, label: Notes, type: text }
          - { name: yelp, label: Yelp page link, type: string }
      - name: not_posted
        label: Cemeteries without posted prices
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: town, label: Town, type: string }
          - { name: phone, label: Phone, type: string }
          - { name: yelp, label: Yelp page link, type: string }
          - { name: status, label: Status, type: string }
          - { name: link, label: Link, type: string }
          - { name: link_text, label: Link text, type: string }
      - { name: county_intro, label: "Elsewhere in Washtenaw County: intro", type: text }
      - name: county
        label: "Elsewhere in Washtenaw County: cemeteries with posted prices"
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: short, label: Short name for table, type: string }
          - { name: town, label: Town, type: string }
          - { name: phone, label: Phone, type: string }
          - { name: website, label: Link to their prices, type: string }
          - { name: rules, label: Second link, type: string }
          - { name: effective, label: Prices effective (blank if not posted), type: string }
          - { name: checked, label: Date checked, type: string }
          - { name: run_by, label: Run by, type: string }
          - { name: natural, label: Natural section, type: string }
          - { name: vault, label: "Vault or liner required?", type: string }
          - { name: buyback, label: "Buys back unused graves?", type: string }
          - { name: sunday, label: "Sunday burials?", type: string }
          - { name: grave, label: Lowest-priced grave ($), type: string }
          - { name: open_weekday, label: Opening and closing weekday ($), type: string }
          - { name: open_saturday, label: Opening and closing Saturday ($), type: string }
          - { name: burial_total, label: Grave plus weekday opening ($), type: string }
          - { name: ashes_ground, label: Ashes in the ground lowest total ($), type: string }
          - { name: niche, label: Niche for ashes lowest total ($), type: string }
          - { name: notes, label: Notes, type: text }
          - { name: yelp, label: Yelp page link, type: string }
      - name: county_not_posted
        label: "Elsewhere in Washtenaw County: without posted prices"
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: town, label: Town, type: string }
          - { name: phone, label: Phone, type: string }
          - { name: status, label: Status, type: string }
          - { name: link, label: Link, type: string }
          - { name: link_text, label: Link text, type: string }
      - name: terms
        label: Cemetery words explained
        type: object
        list: true
        fields:
          - { name: term, label: Term, type: string }
          - { name: meaning, label: Meaning, type: text }
  - name: licenses
    label: Funeral home licenses page
    type: file
    path: _data/licenses.yml
    fields:
      - { name: updated, label: Date licenses were checked, type: string }
      - name: homes
        label: Funeral homes
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: town, label: Town, type: string }
          - { name: status, label: License status, type: string }
          - { name: owner, label: Owner, type: text }
          - { name: discipline, label: State action, type: string }
          - { name: since, label: Note (leave blank to hide), type: text }
          - { name: license, label: License number(s), type: string }
  - name: budget
    label: Sample budget
    type: file
    path: _data/budget.yml
    fields:
      - { name: heading, label: Heading, type: string }
      - { name: scenario, label: Scenario, type: text }
      - name: lines
        label: Budget lines
        type: object
        list: true
        fields:
          - { name: item, label: Item, type: string }
          - { name: low, label: Low ($), type: number }
          - { name: high, label: High ($), type: number }
          - { name: note, label: Note, type: string }
      - { name: comparison, label: Comparison note, type: text }
  - name: dictionary
    label: "What funeral things look like (picture guide)"
    type: file
    path: _data/dictionary.yml
    fields:
      - { name: intro, label: Intro, type: text }
      - name: sections
        label: Sections
        type: object
        list: true
        fields:
          - { name: heading, label: Section heading, type: string }
          - name: items
            label: Items
            type: object
            list: true
            fields:
              - { name: term, label: Name, type: string }
              - { name: aka, label: Also called, type: string }
              - { name: image, label: Photo (upload, or paste a link), type: image }
              - { name: alt, label: Photo description for screen readers, type: string }
              - { name: credit, label: Photo credit (leave blank for your own photos), type: string }
              - { name: credit_url, label: Photo credit link, type: string }
              - { name: description, label: Description, type: text }
              - { name: link, label: Link to a page (optional), type: string }
              - { name: link_text, label: Link text, type: string }
      - { name: behind_heading, label: "'Behind the door' heading", type: string }
      - { name: behind_note, label: "'Behind the door' note (click to open)", type: text }
      - name: behind
        label: "'Behind the door' items"
        type: object
        list: true
        fields:
          - { name: term, label: Name, type: string }
          - { name: aka, label: Also called, type: string }
          - { name: image, label: Photo (upload, or paste a link), type: image }
          - { name: alt, label: Photo description for screen readers, type: string }
          - { name: credit, label: Photo credit (leave blank for your own photos), type: string }
          - { name: credit_url, label: Photo credit link, type: string }
          - { name: description, label: Description, type: text }
          - { name: link, label: Link to a page (optional), type: string }
          - { name: link_text, label: Link text, type: string }
  - name: opinions
    label: Opinions
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - { name: title, label: Title, type: string }
      - { name: description, label: "Short summary (shows in the list and in Google)", type: text }
      - { name: published, label: "Published (off = hidden draft)", type: boolean }
      - { name: related, label: "Related guide link (optional), like /resources/embalming/", type: string }
      - { name: related_text, label: Related guide link text, type: string }
      - { name: body, label: Text, type: rich-text }
